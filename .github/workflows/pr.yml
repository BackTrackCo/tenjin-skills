name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check:dashes
      # the skills installer needs Node 22 or later, so this runs on the Node 24 job only
      - name: Every SKILL.md parses (npx skills add must not skip it)
        if: matrix.node == 24
        run: npm run check:skills
      - name: Gates hash matches every manifest that has one
        run: |
          for m in skills/*/manifest.json; do
            if [ ! -e "$m" ]; then continue; fi
            d=$(dirname "$m")
            want=$(node -p "require('./$m').gatesHash || ''")
            if [ -z "$want" ]; then continue; fi
            cli=$(ls "$d"/scripts/*.mjs | grep -v '/app\.mjs$' | head -1)
            got=$(node "$cli" gates | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).gatesHash")
            test "$want" = "$got"
          done
